# SPDX-License-Identifier: Apache-2.0 OR MIT
[tool.poetry]
name = "pain001-mockbank"
version = "0.0.1"
description = "Synthetic SFTP payment acknowledgements for integration tests."
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
license = "Apache-2.0 OR MIT"
packages = [{include = "pain001_mockbank"}]

[tool.poetry.dependencies]
python = ">=3.10,<4"
pain001 = ">=0.0.70,<1"
asyncssh = ">=2.24,<3"
pyyaml = ">=6,<7"
defusedxml = ">=0.7,<1"
fastapi = {version = ">=0.135,<1", optional = true}
uvicorn = {version = ">=0.53,<1", optional = true}

[tool.poetry.extras]
rest = ["fastapi", "uvicorn"]

[tool.poetry.scripts]
pain001-mockbank = "pain001_mockbank.server:main"

[tool.poetry.group.dev.dependencies]
pytest = ">=9,<10"
pytest-cov = ">=7,<8"
ruff = ">=0.16,<1"
mypy = ">=1,<3"
types-pyyaml = ">=6,<7"
types-defusedxml = ">=0.7,<1"
httpx = ">=0.28,<1"
bandit = ">=1.9,<2"
# pip-audit pulls in filelock (through cachecontrol). filelock <= 4.2.0 has
# GHSA-9vhv-jxww-xfm5, GHSA-567q-5qvw-pf92 and GHSA-v4x8-3wr5-3wq8, and 4.2.1
# needs Python 3.11, so pip-audit installs only there; `make sec` skips it on 3.10.
pip-audit = {version = ">=2.10,<3", python = ">=3.11"}
filelock = {version = ">=4.2.1", python = ">=3.11"}
# certifi comes in through httpx and pip-audit; PYSEC-2026-4320
# (GHSA-6q48-6c7w-9gw2) affects releases before 2026.10.19.
certifi = ">=2026.10.19"

[build-system]
requires = ["poetry-core>=2,<3"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pain001_mockbank --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.mypy]
python_version = "3.10"
strict = true
