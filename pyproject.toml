# SPDX-License-Identifier: Apache-2.0 OR MIT
[tool.poetry]
name = "pain001-mockbank"
version = "0.0.81"
description = "Synthetic SFTP payment acknowledgements for integration tests."
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
license = "Apache-2.0 OR MIT"
packages = [{include = "pain001_mockbank"}]

[tool.poetry.dependencies]
python = ">=3.11,<4"
pain001 = ">=0.0.80,<1"
asyncssh = ">=2.24,<3"
pyyaml = ">=6,<7"
defusedxml = ">=0.7,<1"
fastapi = {version = ">=0.135,<1", optional = true}
uvicorn = {version = ">=0.53,<1", optional = true}

[tool.poetry.extras]
rest = ["fastapi", "uvicorn"]

[tool.poetry.scripts]
pain001-mockbank = "pain001_mockbank.server:main"

[tool.poetry.group.dev.dependencies]
pytest = ">=9,<10"
pytest-cov = ">=7,<8"
ruff = ">=0.16,<1"
mypy = ">=1,<3"
types-pyyaml = ">=6,<7"
types-defusedxml = ">=0.7,<1"
httpx = ">=0.28,<1"
bandit = ">=1.9,<2"
# Complexity gate (scripts/check_complexity.py), as in the siblings.
radon = ">=6.0.1,<7"
complexipy = { version = ">=8.1,<9", python = "<3.16" }
pip-audit = ">=2.10,<3"
# pip-audit pulls in filelock (through cachecontrol). filelock <= 4.2.0 has
# GHSA-9vhv-jxww-xfm5, GHSA-567q-5qvw-pf92 and GHSA-v4x8-3wr5-3wq8.
filelock = ">=4.2.1"
# certifi comes in through httpx and pip-audit; PYSEC-2026-4320
# (GHSA-6q48-6c7w-9gw2) affects releases before 2026.10.19.
certifi = ">=2026.10.19"
# Via pip-audit -> cachecontrol. msgpack < 1.2.3: CVE-2026-114613 (Dependabot #5).
msgpack = ">=1.2.3"

[build-system]
requires = ["poetry-core>=2,<3"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pain001_mockbank --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.mypy]
python_version = "3.11"
strict = true
