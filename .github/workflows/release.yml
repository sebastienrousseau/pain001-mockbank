# SPDX-License-Identifier: Apache-2.0 OR MIT
# Release: build once, prove it, publish it. pain001-mockbank ships in
# lockstep with the pain001 suite: tag vX.Y.Z when the suite releases
# X.Y.Z. It is not published to PyPI; its release is a container image.
#
#   build           sdist + wheel, SLSA build provenance attestation,
#                   keyless sigstore signatures
#   image           ghcr.io/sebastienrousseau/pain001-mockbank:X.Y.Z
#                   (amd64 + arm64, never moved once pushed) with buildx
#                   provenance and SBOM, signed keyless by digest
#   github-release  the distributions, their .sig/.pem and image.txt
#                   (the image reference pinned by digest)
#   release-notes   the release page in the suite's shape
#
# Every action is pinned by commit SHA; Dependabot keeps the pins current.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/sebastienrousseau/pain001-mockbank

jobs:
  build:
    name: Build, attest and sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # sigstore keyless signing
      attestations: write   # SLSA build provenance
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The tag must name the version every source agrees on (pyproject,
      # __version__, CHANGELOG, README, the pain001 floor).
      - name: Verify tag matches package version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG=$(grep -E '^version' pyproject.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "Tag: $VERSION | pyproject.toml: $PKG"
          if [ "$VERSION" != "$PKG" ]; then
            echo "Version mismatch; aborting." >&2
            exit 1
          fi
          python3 scripts/verify_versions.py
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Poetry and its build backend are hash-pinned (requirements/poetry.txt).
      - name: Install Poetry (hash-pinned)
        run: pip install --require-hashes -r requirements/poetry.txt

      - name: Build sdist + wheel
        run: poetry build --no-interaction

      # Verify with: gh attestation verify <file> --repo sebastienrousseau/pain001-mockbank
      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v2.4.3"

      - name: Sign distributions (keyless)
        run: |
          mkdir -p signatures
          for f in dist/*; do
            cosign sign-blob --yes \
              --output-signature "signatures/$(basename "$f").sig" \
              --output-certificate "signatures/$(basename "$f").pem" \
              "$f"
          done

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

      - name: Upload signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures
          path: signatures/

  image:
    name: Versioned image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to GHCR
      id-token: write       # sigstore keyless signing
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A version tag is immutable: refuse to overwrite one already pushed.
      - name: Refuse an existing version tag
        run: |
          if docker manifest inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "${IMAGE}:${VERSION} already exists; versions are immutable." >&2
            exit 1
          fi

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v2.4.3"

      # Signed by digest, so the signature covers the exact image.
      # Verify with: cosign verify <image.txt> --certificate-identity-regexp
      #   'https://github.com/sebastienrousseau/pain001-mockbank/' \
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "${IMAGE}:${VERSION}@${DIGEST}" > image.txt

      - name: Upload the image reference
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.txt

  github-release:
    name: GitHub release
    needs: [build, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download distributions, signatures and the image reference
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: assets/
          merge-multiple: true

      - name: Release notes (releases/v<version>.md)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ ! -s "releases/v${VERSION}.md" ]; then
            echo "No releases/v${VERSION}.md" >&2
            exit 1
          fi
          cp "releases/v${VERSION}.md" release_notes.md

      # Titled "pain001-mockbank X.Y.Z" (no leading v), as the suite's
      # release invariants require.
      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: pain001-mockbank ${{ needs.build.outputs.version }}
          body_path: release_notes.md
          files: assets/*

  # Runs last, once every asset is attached, and rewrites the release
  # body from the live release in the suite's shape. scripts/release_notes.py
  # is vendored byte-identical from pain001.
  release-notes:
    name: Release notes
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # edit the release title and body
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compose and publish the release body
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 scripts/release_notes.py publish --repo "$REPO" \
            --tag "$GITHUB_REF_NAME" --project pain001-mockbank
