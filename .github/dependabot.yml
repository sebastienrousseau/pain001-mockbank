version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      # pain001 is hand-bumped in lockstep with the suite; Dependabot
      # would otherwise propose patch bumps that don't align with our
      # version-for-version release policy.
      - dependency-name: pain001
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
